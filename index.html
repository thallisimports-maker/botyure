<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja e-SIM</title>
    <!-- Script oficial do Telegram para integrar o WebApp -->
    <script src="https://telegram.org"></script>
    
    <style>
        body {
            background-color: #111827;
            color: #f3f4f6;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .container-saldo {
            background-color: #1f2937;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .btn-recarregar {
            background-color: #10b981;
            color: #111827;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-recarregar:hover {
            background-color: #059669;
        }
        .titulo-secao {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #d1d5db;
        }
        .cartao-produto {
            background-color: #1f2937;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid #374151;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .info-produto {
            display: flex;
            align-items: center;
        }
        .icone-operadora-v {
            background-color: #7c3aed;
            color: #ffffff;
            font-weight: bold;
            font-size: 20px;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
        }
        .icone-operadora-c {
            background-color: #ef4444;
            color: #ffffff;
            font-weight: bold;
            font-size: 20px;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
        }
        .btn-comprar {
            background-color: #6366f1;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-top: 4px;
            transition: background-color 0.2s;
        }
        .btn-comprar:hover {
            background-color: #4f46e5;
        }
        .btn-fechar {
            width: 100%;
            background-color: #374151;
            color: #d1d5db;
            font-weight: 500;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho do Usuário -->
    <div class="container-saldo">
        <div>
            <p style="margin: 0; font-size: 12px; color: #9ca3af;">Saldo Disponível</p>
            <p style="margin: 4px 0 0 0; font-size: 24px; font-weight: bold; color: #34d399;">R$ 0,00</p>
        </div>
        <div style="display: flex; align-items: center;">
            <button onclick="recarregarSaldo()" class="btn-recarregar">
                + Recarregar
            </button>
        </div>
    </div>

    <!-- Lista de Produtos / e-SIM -->
    <div style="flex: 1 1 0%;">
        <div class="titulo-secao">Produtos Disponíveis</div>
        
        <!-- Cartão 1: Vivo 30GB -->
        <div class="cartao-produto">
            <div class="info-produto">
                <div class="icone-operadora-v">V</div>
                <div style="margin-left: 12px;">
                    <h3 style="margin: 0; font-weight: bold; font-size: 14px;">e-SIM Vivo 30GB</h3>
                    <p style="margin: 2px 0 0 0; font-size: 12px; color: #9ca3af;">Internet de alta velocidade</p>
                </div>
            </div>
            <div style="text-align: right;">
                <p style="margin: 0; font-size: 16px; font-weight: bold; color: #e5e7eb;">R$ 25,00</p>
                <button onclick="comprarEsim('Vivo 30GB')" class="btn-comprar">Comprar</button>
            </div>
        </div>

        <!-- Cartão 2: Claro 35GB -->
        <div class="cartao-produto">
            <div class="info-produto">
                <div class="icone-operadora-c">C</div>
                <div style="margin-left: 12px;">
                    <h3 style="margin: 0; font-weight: bold; font-size: 14px;">e-SIM Claro 35GB</h3>
                    <p style="margin: 2px 0 0 0; font-size: 12px; color: #9ca3af;">Conectividade total estável</p>
                </div>
            </div>
            <div style="text-align: right;">
                <p style="margin: 0; font-size: 16px; font-weight: bold; color: #e5e7eb;">R$ 30,00</p>
                <button onclick="comprarEsim('Claro 35GB')" class="btn-comprar">Comprar</button>
            </div>
        </div>

        <!-- Cartão 3: Claro 40GB -->
        <div class="cartao-produto">
            <div class="info-produto">
                <div class="icone-operadora-c">C</div>
                <div style="margin-left: 12px;">
                    <h3 style="margin: 0; font-weight: bold; font-size: 14px;">e-SIM Claro 40GB</h3>
                    <p style="margin: 2px 0 0 0; font-size: 12px; color: #9ca3af;">Máxima franquia de dados</p>
                </div>
            </div>
            <div style="text-align: right;">
                <p style="margin: 0; font-size: 16px; font-weight: bold; color: #e5e7eb;">R$ 35,00</p>
                <button onclick="comprarEsim('Claro 40GB')" class="btn-comprar">Comprar</button>
            </div>
        </div>
    </div>

    <!-- Botão de Fechar Nativo -->
    <div>
        <button onclick="tg.close()" class="btn-fechar">
            Voltar para o Chat
        </button>
    </div>

    <!-- Lógica de interações do Telegram -->
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        function recarregarSaldo() {
            // ⚠️ COLE A SUA CHAVE BITPIX REAL DA BIPA DENTRO DAS ASPAS ABAIXO
            const chaveBipa = "nazarenocli0822@outlook.com";

            tg.showPopup({
                title: 'Recarga via PIX',
                message: 'Para adicionar saldo, copie nossa chave BitPix:\n\n' + chaveBipa + '\n\nApós o pagamento, envie o comprovante no chat para validação!',
                buttons: [{type: 'ok', text: 'Entendi'}]
            });
        }

        function comprarEsim(nomePlano) {
            tg.showPopup({
                title: 'Saldo Insuficiente',
                message: 'Você precisa de saldo para comprar o ' + nomePlano + '. Feche a loja e clique em "Adicionar Saldo" no chat.',
                buttons: [{type: 'ok', text: 'Entendi'}]
            });
        }
    </script>
</body>
</html>
